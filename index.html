<!DOCTYPE html>
<html lang='vi'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Nguyen Thi Thien Lam</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
  <header class="site-header">
  <a class="logo" href="image/yyayay.png"></a>
  <nav class="site-nav">
    <ul>
      <li><a href="#about">Giới thiệu</a></li>
      <li><a href="#projects">Dự án</a></li>
      <li><a href="#contact">Liên hệ</a></li>
    </ul>
  </nav>
</header>
<main class="container">
  <section id="about" class="hero">
    <div>
      <h1>I'm Nguyen Thi Thien Lam</h1>
      <p>And welcome to the chaotic world of me</p>
      <a class="button" href="#contact">contract</a>
    </div>
    <img src="image/test 3.jpg" alt="Blue vs Kata" class="image-full"> 
  </section>
  <section id="projects">
    <h2>Dự án</h2>
    <div class="projects">
      <article class="card">
        <h3>Blue</h3>
        <div>
            <img src="image/collab_mmt_body.png" alt="Blue" class="image-full">
        </div>
      </article>
      <article>
        <h3>Đo nhiệt độ bằng Arduino</h3>
        <p>C++ và cảm biến DS18B20.</p>
      </article>
    </div>
  </section>
  <section id="contact">
    <h2>Liên hệ</h2>
    <form>
      <div class="field">
        <label for="name">Họ tên</label>
        <input id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email"
              name="email" required>
      </div>
      <div class="field">
        <label for="msg">message</label>
        <textarea id="msg" name="msg"></textarea>
      </div>
      <button class="button">Gửi</button>
    </form>
  </section>
</main>
  
<footer>© 2026 Nguyen Thi Thien Lam</footer>
</body>
</html>
