<!DOCTYPE html>
<html lang='vi'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Nguyen Thi Thien Lam</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
  <!-- <button id="theme-toggle">Dark mode</button>
  <a class="logo" src="image/yyayay.png"></a> -->
  <img class="avata-bg hero container" src="image/GonNiuuyen.jpg" alt="">
  <nav class="site-nav site-header container">
    <ul>
      <li><a href="#about">About</a></li>
      <li><a href="#projects">Project</a></li>
      <li><a href="#Artwork">Artwork</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
<main class="container">
  <section id="about" class="background_img hero card">
      <div style="margin-block: 5%">
        <h1>I'm Nguyen Thi Thien Lam</h1>
        <p>Welcome to the chaotic world of me</p>
        <a class="button" href="#contact">contract</a>
      </div>
      <img style="height: auto; " src="image/my face.jpg" alt="">
  </section>

  <section class="hero-center container">

  </section>

  <section id="projects">
    <div class="project-header hero-center">
      <div>
        <h2>My Projects</h2>
        <!-- <div style="gap:0px;" id="filters"></div> -->
      </div>
      <search class="search-container">
        <input type="search" id="project-search" placeholder="Searching...">
        <div style="gap:0px;" id="filters"></div>
      </search>
    </div>
      <div class="hero-center container" style="margin-bottom: 20px">
        <div class="project-preview">
          <img id="preview-img" class="image-full card" src="" alt="">
        </div>
        <ul id="project-list" class="projects-list"></ul>
        <template id="project-card">
          <lis class="project-item">
            <h3 style="margin-block: 0px;"></h3>
            <p class="tags" style="margin-block-start: -5px"></p>
          </lis>
        </template>
      </div>
  </section>
  <section id="Artwork">
    <div class="project-header hero-center">
      <h2>My Artwork</h2>
    </div>
    <div class="carousel-container">
      <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
      
      <div class="carousel-track" id="track">
        <div class="card"><img src="" alt=""></div>
      </div>

      <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
    </div>
  </section>
  <section id="contact">
    <h2>Liên hệ</h2>
    <form>
      <div class="field">
        <label for="name">Họ tên</label>
        <input id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email"
              name="email" required>
      </div>
      <div class="field">
        <label for="msg">message</label>
        <textarea id="msg" name="msg"></textarea>
      </div>
      <button class="button">Gửi</button>
    </form>
  </section>
</main>
<footer>© 2026 Nguyen Thi Thien Lam</footer>
<script type="module" src="./app.js"></script>
</body>
</html>
